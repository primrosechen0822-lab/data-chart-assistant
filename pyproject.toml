[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-chart-assistant"
version = "0.1.0"
description = "Reusable data cleaning and plotting commands for AI chat workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
]

[project.scripts]
data-chart = "data_chart_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]